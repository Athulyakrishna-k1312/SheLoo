<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheLoo | Safe Space Mapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #fdf5f2;
            overflow: hidden;
        }

        /* Marble-like background with Rose Gold accents */
        .hero-container {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: 
                linear-gradient(135deg, rgba(226, 175, 160, 0.4) 0%, rgba(255, 255, 255, 0) 40%),
                url('https://www.transparenttextures.com/patterns/white-marble.png');
            text-align: center;
            padding: 20px;
        }

        /* Geometric corner accents */
        .corner-accent {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #d4a391, #e2afa0);
            opacity: 0.6;
            transform: rotate(45deg);
        }
        .top-left { top: -150px; left: -150px; }
        .bottom-right { bottom: -150px; right: -150px; }

        .logo-container {
            z-index: 10;
        }

        .main-title {
            font-size: 8rem;
            font-weight: 600;
            color: #b57a66;
            margin: 0;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Heart-Pin Icon */
        .icon-pin {
            display: inline-block;
            width: 100px;
            height: 100px;
            margin-left: 10px;
            background: radial-gradient(circle at center, #d4a391, #b57a66);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .icon-pin::after {
            content: '❤';
            color: white;
            font-size: 2.5rem;
            position: absolute;
            transform: rotate(45deg);
            top: 15px;
            left: 25px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #8a6356;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: -10px;
            font-weight: 300;
        }

        /* Call to Action Button */
        .btn-next {
            margin-top: 50px;
            padding: 15px 45px;
            background-color: #b57a66;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(181, 122, 102, 0.4);
            z-index: 10;
        }

        .btn-next:hover {
            background-color: #d4a391;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(181, 122, 102, 0.6);
        }

        /* Subtle Map Trace Overlay */
        .map-trace {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 300px;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="corner-accent top-left"></div>
        
        <div class="logo-container">
            <h1 class="main-title">SheLoo<span class="icon-pin"></span></h1>
            <p class="subtitle">Public Toilet & Safe Space Mapper for Women</p>
        </div>

        <a href="map.html" class="btn-next">Find a Safe Space →</a>

        <div class="corner-accent bottom-right"></div>
    </div>

</body>
</html>
