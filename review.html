<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheLoo | Review Toilet</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
body, html {
    margin:0;
    padding:0;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg, #fdf5f2, #fff7f0);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    text-align:center;
    padding:30px 15px;
}

h2 {
    color:#b57a66;
    font-family:'Playfair Display', serif;
    font-size:2.5rem;
    margin-bottom:30px;
    letter-spacing:1px;
}

/* Form Container */
form {
    background:#fff;
    padding:40px 30px;          /* Extra padding inside box */
    border-radius:20px;
    box-shadow:0 8px 25px rgba(181,122,102,0.15);
    width:100%;
    max-width:450px;
    box-sizing:border-box;       /* Ensures padding doesn't overflow */
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

form:hover {
    transform: translateY(-5px);
    box-shadow:0 12px 30px rgba(181,122,102,0.2);
}

label {
    display:block;
    margin-top:20px;
    font-weight:600;
    color:#8a6356;
    font-size:1rem;
    text-align:left;            /* Align labels consistently */
}

input[type=number],
textarea {
    width:100%;
    padding:12px 15px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid #d4a391;
    font-size:1rem;
    font-weight:500;
    transition: all 0.2s ease;
    box-sizing:border-box;      /* Prevents inputs overflowing container */
}

input[type=number]:focus,
textarea:focus {
    border-color:#b57a66;
    outline:none;
    box-shadow:0 0 10px rgba(181,122,102,0.2);
}

textarea {
    resize:none;
    height:100px;
}

button {
    margin-top:25px;
    padding:15px 0;
    border-radius:50px;
    border:none;
    background: linear-gradient(90deg,#b57a66,#d4a391);
    color:white;
    font-size:1.1rem;
    font-weight:600;
    cursor:pointer;
    width:100%;
    transition: all 0.3s ease;
    box-shadow:0 4px 15px rgba(181,122,102,0.3);
}

button:hover {
    transform: translateY(-2px);
    box-shadow:0 6px 20px rgba(181,122,102,0.4);
    background: linear-gradient(90deg,#d4a391,#b57a66);
}

#confirmation {
    margin-top:20px;
    color:#4caf50;
    font-weight:600;
    font-size:1rem;
    min-height:1.2em;
}
</style>
</head>
<body>

<h2 id="toiletName">Toilet Review</h2>

<form id="reviewForm">
    <label for="cleanliness">Cleanliness (1-5):</label>
    <input type="number" id="cleanliness" min="1" max="5" required>

    <label for="lighting">Lighting (1-5):</label>
    <input type="number" id="lighting" min="1" max="5" required>

    <label for="safety">Safety (1-5):</label>
    <input type="number" id="safety" min="1" max="5" required>

    <label for="comments">Comments:</label>
    <textarea id="comments" placeholder="Share your experience..."></textarea>

    <button type="submit">Submit Review</button>
</form>

<div id="confirmation"></div>

<script>
// --- Get toilet info from URL ---
function getQueryParams(){
    const params = new URLSearchParams(window.location.search);
    return {
        lat: parseFloat(params.get('lat')),
        lon: parseFloat(params.get('lon')),
        name: params.get('name')
    };
}

const toilet = getQueryParams();
document.getElementById('toiletName').innerText = `Review: ${toilet.name || 'Toilet'}`;

// --- Handle form submission ---
document.getElementById('reviewForm').addEventListener('submit', function(e){
    e.preventDefault();

    const review = {
        name: toilet.name || 'Toilet',
        lat: toilet.lat,
        lon: toilet.lon,
        cleanliness: parseInt(document.getElementById('cleanliness').value),
        lighting: parseInt(document.getElementById('lighting').value),
        safety: parseInt(document.getElementById('safety').value),
        comments: document.getElementById('comments').value,
        timestamp: new Date().toISOString()
    };

    let reviews = JSON.parse(localStorage.getItem('toiletReviews') || '[]');
    reviews.push(review);
    localStorage.setItem('toiletReviews', JSON.stringify(reviews));

    document.getElementById('confirmation').innerText = '✅ Thank you! Your review has been submitted.';
    document.getElementById('reviewForm').reset();
});
</script>

</body>
</html>
